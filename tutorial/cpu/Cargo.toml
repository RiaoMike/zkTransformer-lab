# Tutorial CPU build manifest; Rust modules are the unmodified upstream sources.
# Icicle dependencies are optional, activated only by the icicle feature.
[package]
name = "zk_torch_2"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[lib]
path = "lib.rs"

[dependencies]
icicle-runtime = { optional = true, git = "https://github.com/ingonyama-zk/icicle", package = "icicle-runtime" }
icicle-core = { optional = true, git = "https://github.com/ingonyama-zk/icicle", package = "icicle-core" }
icicle-bls12-381 = { optional = true, git = "https://github.com/ingonyama-zk/icicle", package = "icicle-bls12-381", features = [
    "msm",
    "pairing",
] }
icicle-goldilocks = { optional = true, git = "https://github.com/ingonyama-zk/icicle", package = "icicle-goldilocks" }
icicle-hash = { optional = true, git = "https://github.com/ingonyama-zk/icicle", package = "icicle-hash" }
icicle-bn254 = { optional = true, git = "https://github.com/ingonyama-zk/icicle", package = "icicle-bn254", features = [
    "msm",
    "pairing",
] }
plonky2 = { version = "0.2.2", features = ["timing"] }
log = { version = "0.4.14", default-features = false }
env_logger = { version = "0.10" }
tract-onnx = { version = "=0.21.6", optional = true }
merlin = { version = "3.0.0" }
serde = { version = "1.0.201", features = ["derive"] }
serde_yaml = "0.9"
bincode = "1.3"
once_cell = "1.15"
rand = "0.8.5"
rayon = "1.10"
ndarray = { version = "0.15.6", features = ["serde", "rayon"] }
ndarray_einsum_beta = "0.7.0"
ark-crypto-primitives = { version = "0.5.0", default-features = false, features = [
    "sponge",
] }
ark-bls12-381 = "0.5.0"
ark-bn254 = "0.5.0"
ark-ec = { version = "0.5.0", default-features = false, features = [
    "parallel",
] }
ark-ff = { version = "0.5.0", default-features = false, features = [
    "parallel",
] }
ark-poly = "0.5.0"
ark-std = "0.5.0"
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "markos/4dim-glv" }

[features]
default = ["bn254", "arkworks"]
bn254 = []
bls12_381 = []
goldilocks = []
icicle = ["dep:icicle-runtime", "dep:icicle-core", "dep:icicle-bls12-381", "dep:icicle-goldilocks", "dep:icicle-hash", "dep:icicle-bn254"]
arkworks = []
onnx = ["dep:tract-onnx", "dep:icicle-core"]

[patch.crates-io]
# Patches to match Dory's requirements (arkworks 0.5.0 with 4dim-glv optimizations)
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "markos/4dim-glv" }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "markos/4dim-glv" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "markos/4dim-glv" }
ark-poly = { git = "https://github.com/a16z/arkworks-algebra", branch = "markos/4dim-glv" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "markos/4dim-glv" }
